schema: spec-driven

context: |
  # Unity Character Combat System (UCCS)

  ## 项目概述
  一个基于 Unity 引擎，以《艾尔登法环》等魂类游戏为灵感的第三人称动作角色扮演游戏（ARPG）原型。
  旨在探索和实现现代动作游戏的核心战斗机制。

  ## 技术栈
  - 引擎: Unity 6000.x (URP 17.1.0)
  - 渲染管线: Universal Render Pipeline (URP) + Unity Toon Shader 0.13.1-preview
  - 动画系统: Animancer Pro (代码驱动动画，替代 Mecanim)
  - AI系统: Behavior Designer (行为树)
  - 相机系统: Cinemachine 2.10.4
  - 输入系统: Unity New Input System 1.14.0
  - 时间轴: Unity Timeline 1.8.7 (自定义技能编辑器，非原生 Playables)
  - 其他: Animation Rigging 1.3.1, TextMesh Pro

  ## 核心系统架构
  - **状态机框架** (Base/): 泛型类型安全状态机，懒加载状态缓存，支持参数化进入
  - **玩家系统** (Player/): 双状态机架构(动画状态机 + 逻辑状态机)，PlayerModel 为中心数据枢纽
  - **技能系统** (EventFactory/): 自定义帧事件时间轴系统(非 Unity Timeline)，8种事件类型(Attack/HitBox/Combo/Effect/Sound/Buff/Loop/Cancel)
  - **攻击与受击** (Attack And Hit/): MeleeWeapon 触发器碰撞检测，HurtBoxManager 身体部位管理，四向受击动画，冻帧反馈，拼刀系统
  - **GAS系统** (GASSystem/): 轻量级 Gameplay Ability System，TagComponent(活跃/瞬态/缓存三类标签)，AttributeSet(生命/韧性/攻击/防御)，Buff系统
  - **敌人系统** (Enemy/): Behavior Designer 行为树驱动，自定义 BT 节点(PlaySkill/MoveTo)
  - **自定义编辑器** (Editor/): UIElements 可视化技能时间轴编辑器(SkillEditorWindow)，运行时调试窗口

  ## 数据架构
  - 大量使用 ScriptableObject: SkillTimelineAsset, AttackData, GameplayEffect, GameplayTagSO, BuffSO, PlayerAnimationSet
  - GameplayTagSO 实例作为标签身份标识(引用相等)
  - 技能数据通过 [SerializeReference] 实现多态序列化
  - AttackData 分离配置(SO)和运行时逻辑(AttackEvent)

  ## 编码规范
  - 代码注释以中文为主，类名/方法名/变量名使用英文
  - 私有字段: _前缀 (如 _Animancer, _currentAttackEvent)
  - 公有字段: camelCase (常用于 Inspector 序列化)
  - 枚举: PascalCase
  - 使用 #region 组织长文件
  - 使用 [Tooltip], [Header], [CreateAssetMenu], [RequireComponent] 等特性
  - 单例模式: MonoBehaviour 单例(FindObjectOfType 懒加载)
  - 工厂模式: ITimelineEventFactory 静态注册表
  - 观察者模式: Action 事件(OnSkillEnd, OnTagAdded, OnDeath 等)

  ## 项目目录结构
  - Assets/Scripts/: 所有游戏逻辑(~70个 .cs 文件)
  - Assets/Editor/: 自定义编辑器工具
  - Assets/ScriptObjects/: 序列化资产实例(Skills/, AttackData/, Buff/, Tag/, GF/, Enemy/)
  - Assets/InputSystem/: 输入系统配置
  - Assets/Animations/, Assets/Animator/: 动画片段和控制器
  - Assets/Model/: 3D 角色模型
  - Assets/Perfab/: 预制体

rules:
  proposal:
    - 使用中文撰写提案
    - 明确说明对现有系统的影响
  design:
    - 使用中文撰写设计文档
    - 遵循项目现有的架构模式(状态机、工厂、ScriptableObject 数据驱动)
    - 明确标注需要修改的现有文件和需要新建的文件
  tasks:
    - 使用中文描述任务
    - 每个任务应该是可独立验证的工作单元
    - 标注任务涉及的文件路径
